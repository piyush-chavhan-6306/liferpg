<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#1c1622" />

    <!-- Canonical -->
    <link rel="canonical" href="https://questlog.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://questlog.app/" />
    <meta property="og:title" content="Questlog — Turn Your Life Into an RPG" />

    <meta property="og:site_name" content="Questlog" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->

    <meta name="twitter:title" content="Questlog — Turn Your Life Into an RPG" />

        "price": "0",

    <link rel="preconnect" href="https://fonts.googleapis.com" />
